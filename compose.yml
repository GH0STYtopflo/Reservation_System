services:
    backend:
        build: .
        env_file:
            - .env
        ports:
            - "8000:8000"
        depends_on:
            pgsql:
                condition: service_healthy


    pgsql:
        image: postgres:latest
        env_file:
            - .env
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 5s
            timeout: 15s
            retries: 5

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "8025:8025"
            - "1025:1025"
        env_file:
            - .env
